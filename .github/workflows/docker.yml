name: Docker CI - Build And Push To ECR

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: web-app-frontend
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ github.sha }}
  VITE_API_URL: "http://web-app-backend.castone.svc.cluster.local:8000"
  K8S_FOLDER: web-app-frontend
  TARGET_BRANCH: main

jobs:
  docker-ci:
    name: Docker Build And Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set Image URI
        id: image
        run: |
          SHORT_SHA="${IMAGE_TAG::7}"
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$SHORT_SHA"

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials Using Access Keys
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR Repository Exists
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true >/dev/null
          fi

      - name: Login To Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Trivy File System Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Build And Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -f Dockerfile \
            -t ${{ steps.image.outputs.image_uri }} \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            .

      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          repository: thaunghtike-share/amm-castone
          token: ${{ secrets.GH_PAT }}
          ref: ${{ env.TARGET_BRANCH }}
          path: gitops-repo

      - name: Create Argo CD Sidecar Override File
        working-directory: gitops-repo/helm_charts/${{ env.K8S_FOLDER }}
        run: |
          SHORT_SHA="${IMAGE_TAG::7}"

          cat <<EOF > .argocd-source-${{ env.K8S_FOLDER }}.yaml
          helm:
            parameters:
              - name: image.tag
                value: "$SHORT_SHA"
                forcestring: true
          EOF

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ".argocd-source-${{ env.K8S_FOLDER }}.yaml"

          if git diff --staged --quiet; then
            echo "No tag change detected."
          else
            git commit -m "deploy: update ${{ env.K8S_FOLDER }} to $SHORT_SHA"
            git push origin "${{ env.TARGET_BRANCH }}"
          fi
